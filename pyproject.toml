[project]
name = "pg-mcp"
version = "0.1.0"
description = "Safe, read-only MCP server that lets AI assistants explore and query PostgreSQL databases in plain English"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Zohaib Tariq" }]
dependencies = [
  "mcp>=2.0",
  "psycopg[binary]>=3.2",
  "sqlglot>=25.0",
  "openai>=1.40",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
pg-mcp = "pg_mcp.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["pg_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
